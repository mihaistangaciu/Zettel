<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zettel</title>
<style>
  :root {
    --bg: #f4f1ec;
    --ink: #2b2a28;
    --muted: #8a857c;
    --note-front: #fff3a3;
    --note-back: #bfe8d0;
    --accent: #2b2a28;
    --panel: #ffffff;
    --line: rgba(0,0,0,.08);
    --good: #2e9e5b;
    --bad: #d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1c1a; --ink: #2b2a28; --muted: #8f8a80; --accent: #f1ece2; --panel: #2a2926; --line: rgba(255,255,255,.1); }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--accent);
  }

  /* ---- top bar: quiet, aligned with the content column ---- */
  header { padding: 14px 20px; }
  .header-in { max-width: 880px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; white-space: nowrap; }
  .brand .logo { width: 20px; height: 20px; border-radius: 3px 3px 3px 8px / 3px 3px 3px 5px; background: var(--note-front); box-shadow: 0 1px 3px rgba(0,0,0,.3); transform: rotate(-6deg); }
  nav { display: flex; align-items: center; gap: 4px; }
  .menu-wrap { position: relative; }
  button.ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 12px;
    border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500;
  }
  button.ghost svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  button.ghost:hover, button.ghost[aria-expanded="true"] { background: var(--line); color: var(--accent); }
  .badge { min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; text-align: center; }
  .badge.zero { background: var(--muted); opacity: .6; }

  .menu {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: 290px; padding: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.18);
  }
  .menu-title { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .menu-section + .menu-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  button.swap {
    display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--accent); font-size: 14px; font-weight: 600;
  }
  button.swap:hover { background: var(--line); color: var(--accent); }
  button.swap svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  button.chip { padding: 7px 14px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: transparent; color: var(--accent); }
  button.chip:hover { background: var(--line); color: var(--accent); }
  button.chip.selected, button.chip.selected:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .custom { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .custom input {
    width: 68px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-weight: 600;
    background: var(--bg); color: var(--accent);
  }
  button.start { width: 100%; margin-top: 14px; padding: 10px 16px; font-size: 14px; }

  /* ---- main ---- */
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 16px 56px; }
  .top { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .stats { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
  .stats .progress { color: var(--muted); letter-spacing: .08em; }
  .stats .dot { color: var(--muted); opacity: .5; }
  .stats .good { color: var(--good); } .stats .bad { color: var(--bad); }
  .bar { width: min(420px, 80vw); height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--muted) 30%, transparent); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

  .scene { perspective: 1200px; width: min(420px, 88vw); height: min(320px, 50vh); }
  .card {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,.7,.2,1);
    transform: rotate(-1.5deg);
  }
  .card.revealed { transform: rotate(1deg) rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 36px; text-align: center; color: var(--ink); border-radius: 4px 4px 4px 28px / 4px 4px 4px 14px;
    box-shadow: 0 1px 1px rgba(0,0,0,.12), 0 14px 28px -8px rgba(0,0,0,.3);
  }
  .face::before { /* tape */
    content: ""; position: absolute; top: -12px; left: 50%; width: 90px; height: 24px;
    transform: translateX(-50%) rotate(2deg); background: rgba(255,255,255,.5);
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
  .front { background: var(--note-front); }
  .back { background: var(--note-back); transform: rotateY(180deg); }
  .label { position: absolute; top: 26px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .55; }
  .text { font-family: "Segoe Print", "Bradley Hand", "Noteworthy", "Comic Sans MS", cursive; font-size: clamp(20px, 4.5vw, 30px); line-height: 1.3; overflow-wrap: anywhere; }

  button {
    font: inherit; font-weight: 600; padding: 12px 28px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--accent); background: transparent; color: var(--accent);
    transition: transform .1s, background .15s, color .15s;
  }
  button:hover { background: var(--accent); color: var(--bg); }
  button:active { transform: scale(.96); }
  button.primary { background: var(--accent); color: var(--bg); }
  button.primary:hover { opacity: .85; }
  button.answer { width: 64px; height: 64px; padding: 0; font-size: 30px; line-height: 1; border-width: 0; color: #fff; }
  button.answer.good { background: var(--good); }
  button.answer.bad { background: var(--bad); }
  button.answer:hover { color: #fff; transform: scale(1.08); }
  button.answer.good:hover { background: #26864d; }
  button.answer.bad:hover { background: #c0433f; }
  .answers { display: flex; gap: 20px; }
  .scene.flash-good { animation: flash-good .5s ease-out; }
  .scene.flash-bad { animation: flash-bad .5s ease-out; }
  @keyframes flash-good { from { filter: drop-shadow(0 0 28px var(--good)); } to { filter: drop-shadow(0 0 0 transparent); } }
  @keyframes flash-bad { from { filter: drop-shadow(0 0 28px var(--bad)); } to { filter: drop-shadow(0 0 0 transparent); } }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }
  .message { max-width: 460px; text-align: center; line-height: 1.5; }
  .error { color: var(--bad); }

  .done { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .done-title { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .done-score { font-size: 64px; font-weight: 800; line-height: 1; }
  .done-sub { color: var(--muted); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }

  /* ---- missed: side panel ---- */
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.18); }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 30; width: min(380px, 100%); display: flex; flex-direction: column;
    background: var(--panel); box-shadow: -12px 0 40px rgba(0,0,0,.18);
    transform: translateX(100%); visibility: hidden; transition: transform .25s ease, visibility 0s .25s;
  }
  .drawer.open { transform: none; visibility: visible; transition: transform .25s ease; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { margin: 0; font-size: 17px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 4px 20px; }
  .pair { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .pair:last-child { border-bottom: 0; }
  .pair .a { font-weight: 600; margin-bottom: 4px; } .pair .b { color: var(--muted); }
  .empty { padding: 48px 0; text-align: center; color: var(--muted); }
  .drawer-foot { padding: 14px 20px; border-top: 1px solid var(--line); }
  button.clear { width: 100%; padding: 10px 16px; font-size: 14px; border-width: 1px; border-color: var(--line); color: var(--muted); }
  button.clear:hover { background: var(--line); color: var(--accent); }

  @media (max-width: 600px) {
    header { padding: 8px 10px; }
    .brand .name, .missed-text { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="header-in">
      <div class="brand"><span class="logo"></span><span class="name">Zettel</span></div>
      <nav id="nav" hidden>
        <div class="menu-wrap">
          <button class="ghost" id="settingsBtn" aria-label="Settings" title="Settings" aria-expanded="false">
            <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          </button>
          <div class="menu" id="menuSettings" hidden>
            <div class="menu-section">
              <div class="menu-title">Direction</div>
              <button class="swap" id="swapBtn" title="Click to swap">
                <span id="dirLabel"></span>
                <svg viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
              </button>
            </div>
            <div class="menu-section">
              <div class="menu-title">Questions per round</div>
              <div class="chips" id="chips"></div>
              <div class="custom">Custom <input type="number" id="qNum" min="1"> <span>of <b id="qTotal"></b></span></div>
              <button class="primary start" id="qStart">Start new round</button>
            </div>
          </div>
        </div>
        <button class="ghost" id="missedBtn" title="Missed words" aria-label="Missed words">
          <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
          <span class="missed-text">Missed</span><span class="badge zero" id="missedCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="top" id="top" hidden>
      <div class="stats">
        <span class="progress" id="progress"></span><span class="dot">&middot;</span>
        <span class="good">&#10003; <span id="goodCount">0</span></span>
        <span class="bad">&#10007; <span id="badCount">0</span></span>
      </div>
      <div class="bar"><div id="bar"></div></div>
    </div>

    <div class="scene" id="scene" hidden>
      <div class="card" id="card">
        <div class="face front"><span class="label" id="labelA"></span><div class="text" id="textA"></div></div>
        <div class="face back"><span class="label" id="labelB"></span><div class="text" id="textB"></div></div>
      </div>
    </div>
    <div id="actions" hidden>
      <button id="reveal" class="primary">Reveal</button>
      <div class="answers" id="answers" hidden>
        <button id="bad" class="answer bad" title="I didn't know it (←)" aria-label="I didn't know it">&#10007;</button>
        <button id="good" class="answer good" title="I knew it (→)" aria-label="I knew it">&#10003;</button>
      </div>
    </div>

    <div class="done" id="done" hidden>
      <div class="done-title">Round complete</div>
      <div class="done-score" id="doneScore"></div>
      <div class="done-sub" id="doneSub"></div>
      <div class="row">
        <button class="primary" id="again">Start new round</button>
        <button id="reviewBtn" hidden>Review missed</button>
      </div>
    </div>

    <div class="hint" id="skipped" hidden></div>
    <div class="hint" id="hint" hidden>Space: reveal &nbsp;·&nbsp; &rarr; knew it &nbsp;·&nbsp; &larr; missed it</div>
    <div class="message" id="message"></div>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Missed words">
    <div class="drawer-head"><h2 id="drawerTitle">Missed words</h2><button class="ghost" id="drawerClose" aria-label="Close" style="width:38px;padding:0">&#10005;</button></div>
    <div class="drawer-body" id="missedBody"></div>
    <div class="drawer-foot"><button class="clear" id="missedClear">Clear list</button></div>
  </aside>

<script>
const $ = id => document.getElementById(id);
let cards = [], labels = ["", ""], order = [], pos = 0, revealed = false, count = 0, pending = 0;
const score = { good: 0, bad: 0 };
const missed = new Set(); // card indexes answered "no", kept until reload or cleared
let flip = localStorage.getItem("flip") !== "0"; // default: show 2nd column (Romanian), recall 1st (German)
const front = c => (flip ? c.b : c.a);
const back = c => (flip ? c.a : c.b);
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- direction ---------- */
function renderDirection() {
  $("dirLabel").textContent = flip ? `${labels[1]} → ${labels[0]}` : `${labels[0]} → ${labels[1]}`;
  $("labelA").textContent = labels[flip ? 1 : 0];
  $("labelB").textContent = labels[flip ? 0 : 1];
}

function toggleDirection() {
  flip = !flip;
  localStorage.setItem("flip", flip ? "1" : "0");
  renderDirection();
  if (!$("scene").hidden) show();
  $("swapBtn").blur();
}

/* ---------- rounds ---------- */
function setPlaying(on) {
  for (const id of ["top", "scene", "actions", "hint"]) $(id).hidden = !on;
  $("done").hidden = on;
}

function renderCounts() {
  $("goodCount").textContent = score.good;
  $("badCount").textContent = score.bad;
  $("missedCount").textContent = missed.size;
  $("missedCount").classList.toggle("zero", missed.size === 0);
}

function startRound(n) {
  count = clamp(Math.round(n) || cards.length, 1, cards.length);
  localStorage.setItem("count", count);
  order = shuffle(cards.map((_, i) => i)).slice(0, count);
  pos = 0;
  score.good = score.bad = 0;
  renderCounts();
  closeMenus();
  setPlaying(true);
  show();
}

function endRound() {
  setPlaying(false);
  $("doneScore").textContent = `${score.good} / ${order.length}`;
  $("doneSub").textContent = `${Math.round((score.good / order.length) * 100)}% correct`;
  $("reviewBtn").hidden = missed.size === 0;
  $("bar").style.width = "100%";
}

function show() {
  const c = cards[order[pos]];
  revealed = false;
  $("card").classList.remove("revealed");
  $("reveal").hidden = false; $("answers").hidden = true;
  $("textA").textContent = front(c);
  setTimeout(() => { if (!revealed) $("textB").textContent = back(c); }, 300); // don't leak the answer during flip-back
  $("progress").textContent = `${pos + 1} / ${order.length}`;
  $("bar").style.width = `${((pos + 1) / order.length) * 100}%`;
}

function reveal() {
  if (revealed || $("scene").hidden) return;
  revealed = true;
  $("textB").textContent = back(cards[order[pos]]);
  $("card").classList.add("revealed");
  $("reveal").hidden = true; $("answers").hidden = false;
}

function answer(correct) {
  if (!revealed || $("scene").hidden) return;
  score[correct ? "good" : "bad"]++;
  if (!correct) missed.add(order[pos]);
  renderCounts();
  if (isDrawerOpen()) renderMissed();
  const scene = $("scene");
  scene.classList.remove("flash-good", "flash-bad");
  void scene.offsetWidth;
  scene.classList.add(correct ? "flash-good" : "flash-bad");
  pos++;
  if (pos >= order.length) endRound(); else show();
}

/* ---------- settings menu ---------- */
const isMenuOpen = () => !$("menuSettings").hidden;
function closeMenus() { $("menuSettings").hidden = true; $("settingsBtn").setAttribute("aria-expanded", "false"); }
function toggleSettings() {
  const open = !isMenuOpen();
  closeMenus();
  if (open) {
    pending = count;
    renderChips();
    $("menuSettings").hidden = false;
    $("settingsBtn").setAttribute("aria-expanded", "true");
  }
}

function renderChips() {
  const total = cards.length;
  const values = [10, 25, 50].filter(v => v < total).concat(total);
  const box = $("chips");
  box.replaceChildren();
  for (const v of values) {
    const b = document.createElement("button");
    b.className = "chip" + (v === pending ? " selected" : "");
    b.textContent = v === total ? "All" : v;
    b.onclick = () => { pending = v; renderChips(); };
    box.append(b);
  }
  $("qNum").max = total;
  $("qNum").value = pending;
  $("qTotal").textContent = total;
}

/* ---------- missed panel ---------- */
const isDrawerOpen = () => $("drawer").classList.contains("open");

function renderMissed() {
  const body = $("missedBody");
  body.replaceChildren();
  const list = [...missed].sort((x, y) => x - y).map(i => cards[i]);
  $("drawerTitle").textContent = list.length ? `Missed words (${list.length})` : "Missed words";
  $("missedClear").hidden = list.length === 0;
  if (!list.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Nothing missed yet — keep going!";
    body.append(e);
    return;
  }
  for (const c of list) {
    const row = document.createElement("div");
    row.className = "pair";
    const a = document.createElement("div"); a.className = "a"; a.textContent = c.a;
    const b = document.createElement("div"); b.className = "b"; b.textContent = c.b;
    row.append(a, b);
    body.append(row);
  }
}

function openMissed() {
  closeMenus();
  renderMissed();
  $("drawer").classList.add("open");
  $("scrim").hidden = false;
}
function closeMissed() { $("drawer").classList.remove("open"); $("scrim").hidden = true; }

/* ---------- wiring ---------- */
function parseDelimited(text, d) {
  const rows = [];
  let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; }
      else cell += ch;
    } else if (ch === '"' && cell === "") quoted = true;
    else if (ch === d) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  row.push(cell); rows.push(row);
  return rows.filter(r => r.some(c => c.trim()));
}

// Static hosting: read words.csv straight from the site. Same rules as server.py (header row, tab > ; > ,).
async function loadStatic() {
  const res = await fetch("words.csv", { cache: "no-store" });
  if (!res.ok) throw new Error("Could not load words.csv");
  const text = (await res.text()).replace(/^﻿/, "");
  const d = text.includes("\t") ? "\t" : text.includes(";") ? ";" : ",";
  const [head = [], ...rows] = parseDelimited(text, d);
  const cards = [];
  let skipped = 0;
  for (const r of rows) {
    const a = (r[0] || "").trim(), b = (r[1] || "").trim();
    if (a && b) cards.push({ a, b }); else skipped++;
  }
  return { labels: [(head[0] || "").trim() || "Column 1", (head[1] || "").trim() || "Column 2"], cards, skipped };
}

async function loadData() {
  const api = await fetch("/api/cards").catch(() => null);
  if (api && api.ok) return api.json();
  if (api && api.status === 500) throw new Error((await api.json()).error);
  return loadStatic();
}

async function init() {
  try {
    const data = await loadData();
    if (!data.cards.length) throw new Error("No cards found in the file.");
    cards = data.cards;
    labels = data.labels;
    if (data.skipped) {
      $("skipped").textContent = `${data.skipped} untranslated ${data.skipped === 1 ? "phrase was" : "phrases were"} skipped`;
      $("skipped").hidden = false;
    }
    renderDirection();
    $("nav").hidden = false;
    startRound(parseInt(localStorage.getItem("count")) || cards.length);
  } catch (e) {
    $("message").innerHTML = `<p class="error">${e.message}</p><p>Check your words file and refresh.</p>`;
  }
}

$("reveal").onclick = reveal;
$("good").onclick = () => answer(true);
$("bad").onclick = () => answer(false);

$("settingsBtn").onclick = toggleSettings;
$("swapBtn").onclick = toggleDirection;
$("qNum").oninput = () => { if ($("qNum").value) { pending = clamp(Math.round(+$("qNum").value), 1, cards.length); renderChipsOnly(); } };
function renderChipsOnly() { const v = $("qNum").value; renderChips(); $("qNum").value = v; $("qNum").focus(); }
$("qNum").onkeydown = e => { if (e.key === "Enter") $("qStart").click(); };
$("qStart").onclick = () => startRound(pending);
$("again").onclick = () => startRound(count);

$("missedBtn").onclick = () => (isDrawerOpen() ? closeMissed() : openMissed());
$("reviewBtn").onclick = openMissed;
$("drawerClose").onclick = closeMissed;
$("scrim").onclick = closeMissed;
$("missedClear").onclick = () => { missed.clear(); renderCounts(); renderMissed(); };

document.addEventListener("click", e => {
  // composedPath is captured at dispatch, so it still works after a chip re-render detaches e.target
  if (!e.composedPath().some(n => n.classList && n.classList.contains("menu-wrap"))) closeMenus();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeMenus(); closeMissed(); return; }
  if (e.target.closest("input, select") || isMenuOpen() || isDrawerOpen()) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveal(); }
  else if (e.key === "ArrowRight") answer(true);
  else if (e.key === "ArrowLeft") answer(false);
});
init();
</script>
